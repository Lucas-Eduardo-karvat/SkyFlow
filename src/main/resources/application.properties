spring.application.name=skyflow_db
server.port=8081

# =============================================================
# PostgreSQL — banco relacional
# Reservas, Voos, Passageiros, Aeronaves, etc.
# =============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/skyflow_db
spring.datasource.username=postgres
spring.datasource.password=senha123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway — migracoes do PostgreSQL
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================================
# MongoDB — banco NoSQL
# Avaliacoes de voos com Aggregation Pipeline
#
# MODELO CAP adotado: AP (Availability + Partition Tolerance)
# Consistencia eventual e aceitavel para avaliacoes/feedbacks.
# Dados financeiros e de reserva permanecem no PostgreSQL (ACID).
# =============================================================
spring.data.mongodb.uri=mongodb://localhost:27017/skyflow_avaliacoes
spring.data.mongodb.database=skyflow_avaliacoes
